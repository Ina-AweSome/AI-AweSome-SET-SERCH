<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-title" content="AI横断">
<title>AI六者横断ノート</title>
<!-- 外部フォントは描画を待たせない（VPN等でGoogle Fontsが遅いとiPadで真っ白のまま止まるため）。
     media=print で読み込み→届いたら all に切替。届かなければ system フォントのまま表示される。 -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#F1F3F6; --surface:#FFFFFF; --sunk:#E7EBF0;
  --ink:#15202B; --muted:#5D6B7A; --line:#D3DAE2;
  --ai:#1F4E79; --agree:#2E7355; --differ:#AE3826; --flagbg:#FBECE8;
  --disp:"Zen Old Mincho",serif; --body:"Zen Kaku Gothic New",system-ui,sans-serif;
}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12161B; --surface:#1B212A; --sunk:#232A34;
  --ink:#E3E8EE; --muted:#94A2B2; --line:#2E3742;
  --ai:#83B4E4; --agree:#66C79B; --differ:#EC8272; --flagbg:#3A2420;
}}
:root[data-theme="dark"]{
  --paper:#12161B; --surface:#1B212A; --sunk:#232A34;
  --ink:#E3E8EE; --muted:#94A2B2; --line:#2E3742;
  --ai:#83B4E4; --agree:#66C79B; --differ:#EC8272; --flagbg:#3A2420;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:15px;line-height:1.85;-webkit-text-size-adjust:100%}
.wrap{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}

/* ---- 左レール ---- */
aside{background:var(--surface);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 0 40px}
.brand{padding:0 18px 14px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand h1{font-family:var(--disp);font-size:19px;margin:0;letter-spacing:.04em;text-wrap:balance}
.brand p{margin:4px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.navbar{display:flex;align-items:center;gap:8px;padding:10px 18px;
  border-bottom:1px solid var(--line)}
.navbar .lbl{flex:1;font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.sortbtn{flex:none;background:var(--sunk);color:var(--ink);border:1px solid var(--line);
  border-radius:6px;padding:4px 9px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer}
.sortbtn:hover{border-color:var(--ai);color:var(--ai)}
.duetop{margin:10px 12px;padding:9px 11px;border-radius:8px;background:var(--flagbg);
  border:1px solid var(--differ);font-size:11.5px;line-height:1.7}
.duetop b{display:block;color:var(--differ);font-size:11px;letter-spacing:.1em;margin-bottom:2px}
.duetop span{display:block;color:var(--ink)}
.duetop .duebtn{display:flex;align-items:baseline;gap:6px;width:calc(100% + 8px);margin:0 -4px;
  padding:3px 4px;border:0;border-radius:5px;background:none;text-align:left;
  font:inherit;font-size:11.5px;line-height:1.7;color:var(--ink);cursor:pointer}
.duetop .duebtn:hover{background:var(--surface)}
.qsrc{display:flex;align-items:center;gap:10px;margin:12px 0 0;flex-wrap:wrap}
.qsrc button{background:var(--sunk);border:1px solid var(--line);border-radius:6px;
  padding:7px 13px;font:inherit;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer}
.qsrc button:hover{border-color:var(--ai);color:var(--ai)}
.qsrc a{font-size:12px;color:var(--ai);text-decoration:none}
.qsrc.audio a{font-size:13px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:6px 12px}
.qsrc.audio a:hover{border-color:var(--ai);text-decoration:none}
.qsrc a:hover{text-decoration:underline}
#qpdfbox iframe{width:100%;height:520px;margin-top:10px;border:1px solid var(--line);
  border-radius:6px;background:var(--surface)}
#qpdfbox .note{font-size:12px;color:var(--muted);margin-top:6px}
@media(max-width:820px){#qpdfbox iframe{height:62vh}}
.duetop .duebtn em{margin-left:auto;font-style:normal;font-weight:700;color:var(--differ);opacity:.8}
.grp{display:flex;align-items:center;gap:7px;width:100%;text-align:left;
  padding:12px 14px 12px 12px;margin-top:6px;background:none;border:0;border-top:1px solid var(--line);
  font:inherit;font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:700;cursor:pointer}
.grp:hover{background:var(--sunk);color:var(--ink)}
.grp .cv{flex:none;display:inline-block;transition:transform .15s;font-size:10px;opacity:.7}
.grp.open .cv{transform:rotate(90deg)}
.grp .gt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp.due .gt{color:var(--differ)}
.grp .badge{flex:none;background:var(--differ);color:#fff;border-radius:4px;
  padding:1px 5px;font-size:9.5px;letter-spacing:.02em}
.grp .fl{flex:none;color:var(--differ);font-size:10px}
.grp .ct{flex:none;color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums;opacity:.8}
.qbtn{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;
  border:0;border-left:3px solid transparent;padding:7px 18px;color:var(--ink);
  font:inherit;font-size:13.5px;cursor:pointer;line-height:1.5}
.qbtn:hover{background:var(--sunk)}
.qbtn.on{border-left-color:var(--ai);background:var(--sunk);font-weight:700}
.qbtn b{font-family:var(--disp);font-size:14px;font-variant-numeric:tabular-nums;flex:none}
.qbtn span{color:var(--muted);font-size:12px;overflow:hidden;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qbtn.on span{color:var(--ink)}
.qbtn em{flex:none;font-style:normal;color:var(--differ);font-weight:700}
.qbtn:focus-visible,button:focus-visible{outline:2px solid var(--ai);outline-offset:-2px}
#navtoggle{display:none;flex:none;background:var(--sunk);color:var(--ink);border:1px solid var(--line);
  border-radius:4px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}

/* ---- 本体 ---- */
main{padding:28px 30px 80px;max-width:1400px}
.qhead{margin-bottom:22px}
.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--muted);font-weight:700}
.qhead h2{font-family:var(--disp);font-size:30px;margin:2px 0 4px;letter-spacing:.03em}
.qhead p{margin:0;color:var(--muted);font-size:14px;max-width:65ch}

h3.sec{font-family:var(--disp);font-size:15px;letter-spacing:.06em;margin:34px 0 12px;
  padding-bottom:6px;border-bottom:1px solid var(--line)}

.scroll{overflow-x:auto}
table{border-collapse:collapse;min-width:560px;width:100%;background:var(--surface);
  border:1px solid var(--line)}
th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top;font-size:13.5px;line-height:1.7}
thead th{background:var(--sunk);font-family:var(--disp);font-size:13px;white-space:nowrap;letter-spacing:.04em}
tbody th{background:var(--sunk);white-space:nowrap;font-weight:700;font-size:12.5px;color:var(--muted)}
td.mid{text-align:center;font-variant-numeric:tabular-nums}
td.ans{font-weight:700;font-variant-numeric:tabular-nums}
tr.split th{color:var(--differ)}
tr.split td{background:var(--flagbg)}
.tok{display:block}
.tok.all{font-weight:700}
.tok.solo{color:var(--differ)}
.na{color:var(--muted);font-size:12.5px;white-space:nowrap}
.legend{font-size:12px;color:var(--muted);margin-top:8px}
.mk{display:inline-block;min-width:1.6em;text-align:center;font-weight:700;border-radius:2px;padding:0 .2em}
.mk.m-a{color:#fff;background:var(--agree)}
.mk.m-b{color:var(--agree);border:1px solid var(--agree)}
.mk.m-c{color:var(--ink);border:1px solid var(--muted)}
.mk.m-d{color:#fff;background:var(--differ)}

.col.nosec{opacity:.85}
.miss{margin:0 0 10px;padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.6;background:color-mix(in srgb,var(--differ) 12%,transparent);border:1px solid color-mix(in srgb,var(--differ) 45%,transparent)}
.miss.ren{background:transparent;border-style:dashed;color:var(--muted)}
.col.nosec summary{cursor:pointer;color:var(--muted);font-size:13px;padding:4px 0}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;position:sticky;top:0;z-index:3;
  background:var(--paper);padding:9px 0;border-bottom:1px solid var(--line)}
.tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:2px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.tabs button.on{background:var(--ai);border-color:var(--ai);color:#fff;font-weight:700}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.col{background:var(--surface);border:1px solid var(--line);padding:0 16px 14px;
  max-height:74vh;overflow:auto;border-radius:3px}
.col h4{margin:0 0 10px;font-family:var(--disp);font-size:13px;letter-spacing:.06em;
  color:var(--ai);border-bottom:1px solid var(--line);padding:11px 0 7px;
  position:sticky;top:0;background:var(--surface);z-index:1}
/* ---- 本文（マークダウンを組んだもの）---- */
.md{font-size:14px;line-height:1.95;word-break:break-word}
.md>:first-child{margin-top:0}
.md>:last-child{margin-bottom:0}
.md p{margin:0 0 .9em}
.md h5{font-family:var(--disp);font-size:14.5px;margin:1.5em 0 .5em;color:var(--ai);
  letter-spacing:.04em;padding-bottom:3px;border-bottom:1px solid var(--line)}
.md h6{font-size:13px;font-weight:700;margin:1.25em 0 .4em}
.md ul,.md ol{margin:.35em 0 .95em;padding-left:1.45em}
.md ul ul,.md ol ol,.md ul ol,.md ol ul{margin:.25em 0 .35em}
.md li{margin:.3em 0;padding-left:.1em}
.md li::marker{color:var(--muted)}
.md strong{font-weight:700}
.md em{font-style:normal;color:var(--ai);font-weight:500}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88em;
  background:var(--sunk);padding:.1em .38em;border-radius:3px}
.md pre{background:var(--sunk);padding:10px 12px;border-radius:4px;overflow-x:auto;margin:.7em 0}
.md pre code{background:none;padding:0;font-size:.86em;line-height:1.7}
.md blockquote{margin:.7em 0;padding:.15em 0 .15em .9em;border-left:2px solid var(--line);color:var(--muted)}
.md table{min-width:0;margin:.7em 0;font-size:12.5px}
.md hr{border:0;border-top:1px solid var(--line);margin:1.1em 0}
.md a{color:var(--ai)}

/* ---- 自分の条文ノートの引用 ---- */
.kw.mine{cursor:pointer;border-style:solid;border-bottom-width:2px;font:inherit;font-size:11.5px}
.kw.mine::after{content:" ✎";opacity:.6}
.art{margin:12px 0 0;padding:12px 15px;background:var(--surface);border:1px solid var(--ai);
  border-left-width:3px;border-radius:3px;display:flex;gap:11px;align-items:baseline;flex-wrap:wrap}
.art b{font-family:var(--disp);font-size:14px;color:var(--ai);white-space:nowrap}
.art span{font-size:13px;line-height:1.8;flex:1;min-width:200px}
.art span.none{color:var(--muted)}
/* 覚えること（一言）＝ここが本体。回数や出典は下に小さく置く */
.art .gist{flex-basis:100%;margin:1px 0 0;font-size:14.5px;line-height:1.8;color:var(--ink)}
.art .gist.none{font-size:13px;color:var(--muted)}
.art .nick{flex:0 0 auto;min-width:0;font-size:12px;color:var(--muted)}
.art .src{flex-basis:100%;flex-grow:0;min-width:0;font-size:11px;line-height:1.6;color:var(--muted)}
.art .acts .lbl{flex:0 0 auto;min-width:0;font-size:11px;color:var(--muted);
  align-self:center;padding-right:2px}
.art .jobun{flex-basis:100%;margin:6px 0 4px;padding:10px 12px;background:var(--sunk);border-left:3px solid var(--ai);
  font-size:14px;line-height:1.85;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.art .jobun.clip{max-height:11.5em;overflow:hidden;position:relative}
.art .jobun-more{font-size:12px;color:var(--ai);background:none;border:0;padding:0;cursor:pointer}
.art .jobun-src{flex-basis:100%;font-size:11px;color:var(--muted);margin-bottom:6px}
.art a{font-size:12px;white-space:nowrap;color:var(--ai)}
.kw{cursor:pointer}
.kw .imp{font-size:9px;letter-spacing:-.5px;opacity:.75;margin-left:3px;vertical-align:1px}
.artwrap{margin:2px 0 6px}
.kw.note{border-style:solid;border-color:var(--accent,#b8860b);color:var(--accent,#b8860b);
  background:var(--paper);font-weight:700}
.kw.note:hover{background:var(--sunk)}
.kws.dayx{margin:10px 0 0;padding-top:10px;border-top:1px dashed var(--line)}
.kws.dayx .lbl{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;
  align-self:center;margin-right:2px}
.art .note-body{flex-basis:100%;font-size:13.5px;line-height:1.85;margin-top:6px;
  max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.art .note-body table{min-width:0}
.kw:hover{background:var(--sunk);border-color:var(--ai)}
.kw:not(.mine):not(.has){border-style:dashed}   /* 押しても何も出ない語だけ点線 */
.art .acts{display:flex;gap:7px;flex-wrap:wrap;flex-basis:100%;margin-top:2px}
.art .acts a,.art .acts button{font-size:11.5px;white-space:nowrap;color:var(--ai);
  border:1px solid var(--line);border-radius:3px;padding:4px 10px;background:var(--paper);
  font-family:inherit;cursor:pointer;line-height:1.5}
.art .acts a:hover,.art .acts button:hover{border-color:var(--ai);background:var(--sunk)}
.art .cur{flex-basis:100%;margin-top:8px}
.art .cur textarea{width:100%;min-height:132px;font-family:var(--mono,ui-monospace,Menlo,monospace);
  font-size:11.5px;line-height:1.7;color:var(--ink);background:var(--sunk);
  border:1px solid var(--line);border-radius:3px;padding:10px 12px;resize:vertical}
.art .cur p{font-size:11px;color:var(--muted);margin:5px 0 0;line-height:1.6}

/* ---- 過去につまずいた記録 ---- */
.past{margin-top:8px;padding:11px 15px;border:1px solid var(--line);border-radius:3px;
  background:var(--surface)}
.past.q{border-left:3px solid var(--differ)}
.past.m{border-left:3px solid var(--muted)}
.past>b{display:block;font-size:12px;letter-spacing:.06em;margin-bottom:6px}
.past.q>b{color:var(--differ)}
.past.m>b{color:var(--muted)}
.past ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.past li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;font-size:12.5px;line-height:1.6}
.past .d{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11.5px;white-space:nowrap}
.past a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.past a:hover{border-bottom-color:var(--ai);color:var(--ai)}

/* ---- 判定の見方 ---- */
.howto{margin-top:9px;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
.howto summary{cursor:pointer;padding:9px 13px;font-size:12.5px;color:var(--ai);font-weight:700;
  list-style:none;min-height:38px;display:flex;align-items:center}
.howto summary::before{content:"▸ ";margin-right:4px}
.howto[open] summary::before{content:"▾ "}
.howto summary::-webkit-details-marker{display:none}
.howto>:not(summary){margin:0 13px 11px;font-size:12.5px;line-height:1.8;color:var(--muted)}
.howto b{color:var(--ink)}
.howtab{min-width:0;margin:0 13px 11px;width:calc(100% - 26px)}
.howtab th{white-space:nowrap;width:1%;text-align:left}
.howtab td{font-size:12.5px;color:var(--muted)}
.howto .warn{border-left:2px solid var(--differ);padding-left:10px}
.howto .sub{font-size:12px}

/* ---- 疑問メモ欄 ---- */
.ask{background:var(--surface);border:1px solid var(--line);border-radius:3px;
  padding:14px 16px;margin:18px 0 6px}
.ask label{display:block;font-family:var(--disp);font-size:13px;letter-spacing:.06em;
  color:var(--ai);margin-bottom:7px}
.ask textarea{width:100%;font:inherit;font-size:14px;line-height:1.7;color:var(--ink);
  background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:9px 11px;
  resize:vertical;min-height:70px}
.ask textarea:focus{outline:2px solid var(--ai);outline-offset:-1px}
.askbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.askbtns button{border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:3px;padding:9px 16px;font:inherit;font-size:13.5px;cursor:pointer;min-height:40px}
.askbtns button:hover{background:var(--sunk)}
.askbtns .primary{background:var(--ai);border-color:var(--ai);color:#fff;font-weight:700}
.ask .hint{margin:9px 0 0;font-size:11.5px;color:var(--muted);line-height:1.7}
.col h4{display:flex;align-items:center;gap:8px}
.kws{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 12px;padding-bottom:11px;
  border-bottom:1px dashed var(--line)}
.kw{font-size:11.5px;line-height:1.5;padding:2px 9px;border-radius:2px;
  border:1px solid var(--line);background:var(--paper);color:var(--muted)}
.kw.all{border-color:var(--agree);color:var(--agree);font-weight:700}
.kw.solo{border-color:var(--differ);color:var(--differ);background:var(--flagbg)}
.col .send{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--paper);color:var(--muted);
  border-radius:3px;font:inherit;font-size:11px;font-weight:400;letter-spacing:0;line-height:1.3;
  padding:5px 8px;cursor:pointer;min-height:30px;white-space:nowrap}
.col .send:hover{background:var(--ai);border-color:var(--ai);color:#fff}
#flash{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:4px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:20;max-width:88vw;text-align:center}
#flash.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- まず読む（どのAIから読むか）---- */
.pick{margin:18px 0 0;padding:13px 16px;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--agree);border-radius:3px}
.pk-main{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pk-lbl{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.pk-ai{font-family:var(--disp);font-size:19px;color:var(--ai);background:none;border:0;
  border-bottom:2px solid var(--ai);padding:0 2px 1px;cursor:pointer;letter-spacing:.04em}
.pk-ai:hover{background:var(--sunk)}
.pk-star{color:var(--agree);letter-spacing:.08em;font-size:14px}
.pk-star.mid{color:var(--muted)}
.pk-star.lo{color:var(--differ)}
.pk-num{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pk-why{margin:6px 0 0;font-size:13.5px;line-height:1.8;color:var(--ink)}
.pk-alt{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
  font-size:12.5px;line-height:2;color:var(--muted)}
.pk-alt .row{display:block}
.pk-alt button{font:inherit;font-size:12.5px;font-weight:700;color:var(--ai);background:none;
  border:0;border-bottom:1px solid var(--line);padding:0 1px;cursor:pointer}
.pk-alt button:hover{border-bottom-color:var(--ai);background:var(--sunk)}
.pk-alt .bad{color:var(--differ);font-weight:700}
.pk-alt .bad button{color:var(--differ)}

/* ---- AIクローズアップ ---- */
.aibar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:18px 0 2px}
.aibar .lbl{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-right:2px}
.aibar button{border:1px solid var(--line);background:var(--surface);color:var(--muted);
  border-radius:999px;padding:5px 13px;font:inherit;font-size:12.5px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;min-height:34px}
.aibar button em{font-style:normal;font-size:10.5px;font-variant-numeric:tabular-nums;opacity:.7}
.aibar button:hover{border-color:var(--ai);color:var(--ai)}

  });
  const code = [];
  h = h.replace(/`([^`]+)`/g, (m,c)=>{ code.push(c); return '\uE000'+(code.length-1)+'\uE001'; });
  h = h.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>')
       .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
       .replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>')
       .replace(/~~([^~]+)~~/g, '<s>$1</s>')
       .replace(/\[([^\]]*)\]\(#drive=([A-Za-z0-9_-]+)\)/g,
                '<a href="#" class="drv" data-drv="$2">$1</a>')
       .replace(/\[([^\]]*)\]\((https?:\/\/[^\s)]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return h.replace(/\uE000(\d+)\uE001/g, (m,i)=>'<code>'+code[+i]+'</code>');
}
function md(src){
  if(!src) return '';
  const L = String(src).replace(/\r\n?/g,'\n').split('\n');
  const out = []; let i = 0, para = [];
  const flush = () => { if(para.length){ out.push('<p>'+inline(para.join('\n')).replace(/\n/g,'<br>')+'</p>'); para = []; } };
  const depth = sp => Math.min(Math.floor(sp.replace(/\t/g,'  ').length/2), 1);
  const LI = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;

  while(i < L.length){
    const ln = L[i];

    if(/^\s*```/.test(ln)){
      flush(); const buf = []; i++;
      while(i < L.length && !/^\s*```/.test(L[i])) buf.push(L[i++]);
      i++; out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>'); continue;
    }
    if(/^\s*(-{3,}|_{3,}|\*{3,})\s*$/.test(ln)){ flush(); out.push('<hr>'); i++; continue; }

    let m = ln.match(/^\s*(#{1,6})\s+(.*)$/);
    if(m){ flush(); const t = m[1].length <= 3 ? 5 : 6;
      out.push('<h'+t+'>'+inline(m[2])+'</h'+t+'>'); i++; continue; }

    if(/^\s*\|.*\|\s*$/.test(ln)){
      flush(); const rows = [];
      while(i < L.length && /^\s*\|.*\|\s*$/.test(L[i])){
        rows.push(L[i].trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim())); i++;
      }
      const sep = rows[1] && rows[1].every(c=>/^:?-{2,}:?$/.test(c));
      const head = sep ? rows[0] : null, body = sep ? rows.slice(2) : rows;
      out.push('<div class="scroll"><table>'
        + (head ? '<thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead>' : '')
        + '<tbody>'+body.map(r=>'<tr>'+r.map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>').join('')
        + '</tbody></table></div>');
      continue;
    }

    m = ln.match(LI);
    if(m){
      flush();
      const stack = [];
      const open = t => { out.push('<'+t+'>'); stack.push(t); };
      open(/\d/.test(m[2]) ? 'ol' : 'ul');
      let d0 = depth(m[1]);
      while(i < L.length){
        const mm = L[i].match(LI);
        if(!mm){
          if(/^\s+\S/.test(L[i]) && out.length && /<\/li>$/.test(out[out.length-1])){
            out[out.length-1] = out[out.length-1].replace(/<\/li>$/, '<br>'+inline(L[i].trim())+'</li>');
            i++; continue;
          }
          break;
        }
        const d = depth(mm[1]);
        if(d > d0){ open(/\d/.test(mm[2]) ? 'ol' : 'ul'); d0 = d; }
        while(d < d0 && stack.length > 1){ out.push('</'+stack.pop()+'>'); d0--; }
        out.push('<li>'+inline(mm[3])+'</li>');
        i++;
      }
      while(stack.length) out.push('</'+stack.pop()+'>');
      continue;
    }

    if(/^\s*>\s?/.test(ln)){
      flush(); const buf = [];
      while(i < L.length && /^\s*>\s?/.test(L[i])) buf.push(L[i++].replace(/^\s*>\s?/,''));
      out.push('<blockquote>'+md(buf.join('\n'))+'</blockquote>'); continue;
    }

    if(!ln.trim()){ flush(); i++; continue; }
    para.push(ln); i++;
  }
  flush();
  return out.join('');
}

/* ── 復習どき：3日前・1週間前・21日前にあたる日に印を出す ── */
const CHECKPOINTS = [{n:3, l:'3日前'}, {n:7, l:'1週間前'}, {n:21, l:'21日前'}];
const ymd = s => String(s).slice(0, 10);
function daysAgo(day){
  const m = ymd(day).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return null;
  const then = new Date(+m[1], +m[2]-1, +m[3]); then.setHours(0,0,0,0);
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((now - then) / 86400000);
}
function dueOf(day){
  const n = daysAgo(day);
  if (n === null) return null;
  const hit = CHECKPOINTS.find(c => c.n === n);
  return hit ? hit.l : null;
}

function newestDay(){
  let p = null;
  DB.days.forEach(d => { if (d.qs.length && (!p || d.day > p)) p = d.day; });
  return p;

  if (navState.open && day in navState.open) return !!navState.open[day];
  return day === newestDay();          /* 既定はいちばん新しい日だけ開く */

      + (label ? `<span class="badge">${label}</span>` : '')
      + (flags ? `<span class="fl">⚑${flags}</span>` : '')

    h.onclick = () => { setOpen(d.day, !isOpen(d.day)); buildNav(); markActive(); };

    d.qs.forEach(q => {

      b.innerHTML = `<b>${q.id}</b><span>${esc(q.title||'—')}</span>` + (flagged(q)?'<em>⚑</em>':'');
      b.onclick = () => show(d.day + q.id);

let secPick = null;

const MARKCLS = {"◎":"m-a","○":"m-b","△":"m-c","✕":"m-d"};

/* ---- どのAIから読むか（おすすめ度） -------------------------------------
   内容の当否ではなく「他の4つと突き合わせて、どれが取りこぼしていないか」の点数。
   見る軸は5つ。その問題で見られる軸だけを使って100点に均す。
     結論の一致 40 ／ 条文の網羅 20 ／ 判例の網羅 15 ／ 構成 15 ／ 厚み 10
   論文（正解も肢も無い）では結論の軸が落ちるので、残りの4軸で均される。 */
const W_ANS = 40, W_ART = 20, W_CASE = 15, W_SEC = 15, W_LEN = 10;
const RANKC = new WeakMap();

function aiRank(q){
  if (RANKC.has(q)) return RANKC.get(q);
  const A = ais(q);
  if (!A.length) return null;
  const rv = q.review || {};
  const half = Math.max(2, Math.ceil(A.length / 2));
  const tally = f => { const m = {};
    A.forEach(a => [...new Set(q.ai[a][f] || [])].forEach(x => m[x] = (m[x]||0) + 1)); return m; };
  const artT = tally('articles'), caseT = tally('cases');
  const common = t => Object.keys(t).filter(k => t[k] >= half);
  const cArts = common(artT), cCases = common(caseT);
  const labels = [...new Set(A.flatMap(a => Object.keys(q.ai[a].choices || {})))].sort();
  const maj = vs => { const c = {}; vs.filter(Boolean).forEach(v => c[v] = (c[v]||0) + 1);
    const e = Object.entries(c).sort((x,y) => y[1] - x[1]);
    return (e.length && (e.length === 1 || e[0][1] > e[1][1])) ? e[0][0] : null; };
  const majAns = maj(A.map(a => na(q.ai[a].answer || '')));
  const majCh = {}; labels.forEach(lb => majCh[lb] = maj(A.map(a => (q.ai[a].choices||{})[lb])));
  const charsOf = a => (rv[a] && rv[a].chars) || Object.values(q.ai[a].sections || {}).join('').length;
  const maxChars = Math.max(1, ...A.map(charsOf));
  const minChars = Math.min(...A.map(charsOf));
  const ronbun = !labels.length && !A.some(a => q.ai[a].answer);
  const wantSecs = ronbun ? 5 : 7;

  const per = {};
  A.forEach(a => {
    const g = q.ai[a];
    const arts = new Set(g.articles || []), cases = new Set(g.cases || []);
    const secs = Object.keys(g.sections || {}).length, chars = charsOf(a);
    const ax = [], good = [], warn = [];
    let shaky = false;

    if (majAns || labels.length){
      let v = 1;
      if (majAns){
        if (!g.answer) { v = .35; warn.push('正解を書いていない'); }
        else if (na(g.answer) !== majAns) { v = 0; shaky = true; warn.push('正解が他AIと違う（' + g.answer + '）'); }
        else good.push('正解一致');
      }
      const ng = labels.filter(lb => (g.choices||{})[lb] && majCh[lb] && g.choices[lb] !== majCh[lb]);
      if (ng.length) { v = Math.max(0, v - .34 * ng.length); shaky = true;
        warn.push('肢' + ng.join('・') + 'の○×が他AIと逆'); }
      ax.push([W_ANS, v]);
    }
    if (cArts.length){
      const miss = cArts.filter(x => !arts.has(x));
      ax.push([W_ART, 1 - miss.length / cArts.length]);
      if (miss.length) warn.push('条文が抜け（' + miss.slice(0,3).join('・') + (miss.length>3?'ほか':'') + '）');
      else good.push('条文' + cArts.length + '件すべてに触れた');
    }
    if (cCases.length){
      const miss = cCases.filter(x => !cases.has(x));
      ax.push([W_CASE, 1 - miss.length / cCases.length]);
      if (miss.length) warn.push('判例が抜け（' + miss.slice(0,2).join('・') + (miss.length>2?'ほか':'') + '）');
      else good.push('判例' + cCases.length + '件すべてに触れた');
    }
    ax.push([W_SEC, Math.min(1, secs / wantSecs)]);
    ax.push([W_LEN, chars / maxChars]);
    if (secs >= wantSecs) good.push(secs + '節そろっている');
    if (chars === maxChars && A.length > 1) good.push('いちばん詳しい（' + chars.toLocaleString() + '字）');
    if (chars === minChars && A.length > 1) good.push('いちばん短い（' + chars.toLocaleString() + '字）');

    const wsum = ax.reduce((s0,[w]) => s0 + w, 0);
    const score = Math.round(100 * ax.reduce((s0,[w,v]) => s0 + w * Math.max(0, Math.min(1, v)), 0) / wsum);
    per[a] = { score, chars, secs, good, warn, shaky,
               solo: { articles: [...arts].filter(x => artT[x] === 1),
                       cases:    [...cases].filter(x => caseT[x] === 1) } };
  });

  const rank = A.slice().sort((x,y) => per[y].score - per[x].score || per[y].chars - per[x].chars);
  rank.forEach((a,i) => per[a].place = i + 1);
  const ok = rank.filter(a => !per[a].shaky && per[a].score >= 55);
  const out = { per, rank, ronbun, cArts, cCases,
                best: rank[0], second: rank[1],
                light: ok.slice().sort((x,y) => per[x].chars - per[y].chars)[0],
                shaky: A.filter(a => per[a].shaky) };
  RANKC.set(q, out);
  return out;
}

const STARS = n => { const k = n >= 90 ? 5 : n >= 78 ? 4 : n >= 62 ? 3 : n >= 45 ? 2 : 1;
  return '★★★★★'.slice(0, k) + '☆☆☆☆☆'.slice(0, 5 - k); };
const BARCLS = n => n >= 70 ? '' : (n >= 45 ? 'mid' : 'lo');
const aibtn = (a, cls) => '<button data-open="' + esc(a) + '"' + (cls ? ' class="' + cls + '"' : '')
  + ' title="' + esc(a + ' だけを全画面で読む') + '">' + esc(a) + '</button>';

/* ---- 「まず読む」の一枚 ---- */
function pickBox(q){
  const R = aiRank(q);
  if (!R || R.rank.length < 2) return '';
  const b = R.per[R.best];
  const why = (b.good.length ? b.good : ['他のAIと大きな食い違いはない']).slice(0,3).join('／')
            + (b.warn.length ? '　ただし ' + b.warn.slice(0,2).join('／') : '');
  const rows = [];
  if (R.second && R.per[R.second].score >= b.score - 12)
    rows.push('<span class="row">次に読むなら ' + aibtn(R.second) + ' <span class="pk-num">'
      + R.per[R.second].score + '</span>'
      + (R.per[R.second].good.length ? '　' + esc(R.per[R.second].good[0]) : '') + '</span>');
  if (R.light && R.light !== R.best)
    rows.push('<span class="row">時間がないときは ' + aibtn(R.light)
      + '　' + R.per[R.light].chars.toLocaleString() + '字で同じ結論</span>');
  if (R.shaky.length)
    rows.push('<span class="row bad">⚑ 鵜呑みにしない — '
      + R.shaky.map(a => aibtn(a) + '（' + esc(R.per[a].warn[0] || '他AIと食い違い') + '）').join('・') + '</span>');
  const solo = R.rank.filter(a => R.per[a].solo.articles.length || R.per[a].solo.cases.length);
  if (solo.length)
    rows.push('<span class="row">ここだけが挙げた — ' + solo.slice(0,3).map(a => aibtn(a) + '（'
      + esc([...R.per[a].solo.articles, ...R.per[a].solo.cases].slice(0,2).join('・')) + '）').join('・') + '</span>');
  return '<div class="pick"><div class="pk-main"><span class="pk-lbl">まず読む</span>'
    + '<button class="pk-ai" data-open="' + esc(R.best) + '" title="' + esc(R.best + ' だけを全画面で読む') + '">'
    + esc(R.best) + ' ⤢</button>'
    + '<span class="pk-star ' + BARCLS(b.score) + '">' + STARS(b.score) + '</span>'
    + '<span class="pk-num">おすすめ度 ' + b.score + ' / 100</span></div>'
    + '<p class="pk-why">' + esc(why) + '</p>'
    + (rows.length ? '<div class="pk-alt">' + rows.join('') + '</div>' : '')
    + '</div>';
}

/* ---- 全画面リーダー：1つのAIだけを一面に出して読む ----
   列見出し・講評表・比較表のAI名を押すと開く。Esc か ✕ で元の位置に戻る。 */
let READ = null, rSec = null, rScroll = 0;
const ALLSEC = '＊全文';
const readerEl = document.getElementById('reader');

function rdSections(q, a){ return Object.keys(q.ai[a].sections || {})
  .sort((x,y) => SECORD.indexOf(x[0]) - SECORD.indexOf(y[0])); }

function drawReader(){
  const q = CUR, a = READ;
  if (!q || !a || !q.ai[a]) return;
  const R = aiRank(q), p = R ? R.per[a] : null;
  const A = ais(q), i = A.indexOf(a);
  const secs = rdSections(q, a);
  if (rSec !== ALLSEC && !q.ai[a].sections[rSec]) rSec = secs.length ? secs[0] : ALLSEC;
  const pick = rSec === ALLSEC ? secs : [rSec];
  const body = pick.map(k => (pick.length > 1 ? '<div class="rd-h">' + esc(k) + '</div>' : '')
                            + '<div class="md">' + md(q.ai[a].sections[k]) + '</div>').join('');
  const chips = (rSec === ALLSEC ? secs : [rSec])
    .flatMap(k => kws(q.ai[a].sections[k] || '', q.ai[a]));
  const seen = new Set(), chipHtml = chips.filter(k => !seen.has(k) && seen.add(k))
    .map(k => '<button class="kw' + ((ARTS[k] || PAST[k]) ? ' mine' : '')
      + ((gistFor(k) || localGist(k)) ? ' has' : '') + '" data-k="' + esc(k) + '">' + esc(k) + '</button>').join('');
  const notes = (q.ai[a].notes || []).map((nt, j) =>
    '<button class="kw note" data-note="' + esc(a) + '|' + j + '">📎 ' + esc(nt.t) + '</button>').join('');
  const prev = A[(i - 1 + A.length) % A.length], next = A[(i + 1) % A.length];

  readerEl.innerHTML =
      '<div class="rd-top">'
    +   '<button class="rd-x">✕ 戻る</button>'
    +   '<div class="rd-who"><span class="rd-name">' + esc(a) + '</span>'
    +     (p ? '<span class="pk-star ' + BARCLS(p.score) + '">' + STARS(p.score) + '</span>'
             + '<span class="pk-num">おすすめ度 ' + p.score + '</span>' : '')
    +   '</div>'

const LAWRE = /(?:民法|商法|会社法|手形法|小切手法|刑法|刑事訴訟法|刑訴法|民事訴訟法|民訴法|公職選挙法|公選法|憲法|行政法|破産法)?第?\d{1,4}条(?:の\d{1,2})?(?:[ⅠⅡⅢⅣⅤ]|第?\d項)?/g;
/* 肢の○×や「誤答原因」のような、覚える対象ではない太字はチップにしない */
const KW_NG = /[○◯×✕]|^(誤答原因|分析|判断のポイント|ポイント|結論|まとめ|注意|補足|理由|要点|今回|正解|覚え方|ひっかけ|次回|解き方|チェック|根拠条文|根拠|条文・判例)/;
function kws(t, ai){
  const out = [];
  const push = x => {
    x = String(x||'').trim().replace(/^[「『（(\[]+|[」』）)\]]+$/g,'').replace(/[、。：:]$/,'');
    if(KW_NG.test(x)) return;
    if(x.length>=2 && x.length<=16 && !/[。！？\n]/.test(x) && !out.includes(x)) out.push(x);
  };
  (ai.articles||[]).slice(0,4).forEach(push);      // 挙げた条文
  (ai.cases||[]).slice(0,3).forEach(push);         // 挙げた判例
  if(t){                                           // 本文の太字のうち、語として短いもの
    (t.match(/\*\*([^*\n]{2,16})\*\*/g)||[]).forEach(m => push(m.replace(/\*\*/g,'')));
    (t.match(LAWRE)||[]).forEach(push);
  }
  return out.slice(0,7);
}

/* ---- 覚えることを一言で ----
   チップを押した／ホバーしたとき、いちばん先に出す行。
   「212問中6問に出ています」のような回数は、それだけでは何も思い出せない。 */
const LAW_DEF = {"刑訴法":"刑訴法","民訴法":"民訴法","商法":"手形法","民法":"民法",
  "刑法":"刑法","行政法":"行政法","憲法":"憲法","倒産法":"破産法"};
const LAW_RE = /^(刑事訴訟法|民事訴訟法|行政事件訴訟法|行政不服審査法|行政手続法|国家賠償法|不動産登記法|公職選挙法|小切手法|会社法|手形法|会計法|破産法|民事執行法|刑訴法|民訴法|民執法|行訴法|公選法|刑訴|民訴|刑法|民法|憲法|商法)/;
function gistFor(k){
  if (GIST[k]) return GIST[k];
  /* 「37条Ⅱ」「321条3項」のように項・号が付いた語、法令名が省かれた語も引けるようにする */
  let base = String(k).replace(/(前段|後段|本文|ただし書|柱書)+\s*$/, '')
                      .replace(/(第?\d+項|[ⅠⅡⅢⅣⅤ]+|第?\d+号)+\s*$/, '').trim();
  base = base.replace(/第(\d)/, '$1');          // 「第15条」→「15条」
  if (GIST[base]) return GIST[base];
  if (/\d+条/.test(base) && !LAW_RE.test(base)){
    const law = LAW_DEF[(CUR && CUR.subject) || ''] || '';
    if (law && GIST[law + base]) return GIST[law + base];
  }
  return null;
}

/* 条文でも判例でもない語（「連座制」「在外選挙権」など）は索引に無い。
   その場合だけ、いま開いている問題の解説から、その語を説明している一文を拾う。 */
let LG = {}, LGQ = '';
const LG_GOOD = /(とは|である|をいう|しなければ|できる|できない|認め|成立|必要|要する|当たる|反しない|違反|無効|有効|原則|例外|趣旨)/;
const LG_BAD = /(本問|今回|肢|正解|上記|下記|前述|次回|参照)/;
function localGist(k){
  if (!CUR) return null;
  if (LGQ !== CUR.day + CUR.id){ LG = {}; LGQ = CUR.day + CUR.id; }
  if (k in LG) return LG[k];
  let best = null;
  for (const a of Object.keys(CUR.ai || {})){
    const secs = CUR.ai[a].sections || {};
    for (const sec of Object.keys(secs)){
      for (const line of String(secs[sec]).split(/\n/)){
        for (const sent of line.split(/(?<=。)/)){
          const t = sent.replace(/\[([^\]]*)\]\([^)]*\)/g,'$1').replace(/https?:\/\/\S+/g,'')
                        .replace(/[*`>#\[\]]+/g,'').trim().replace(/^[-・\s]+/,'');
          if (t.length < 14 || t.length > 130 || t.indexOf(k) < 0) continue;
          if (t.length < k.length + 10) continue;     // 語をなぞっただけの一文は要らない
          let sc = 0;
          if (LG_GOOD.test(t)) sc += 3;
          if (LG_BAD.test(t)) sc -= 3;
          if (t.endsWith('。')) sc += 2;
          if (sec.startsWith('④') || sec.startsWith('⑤') || sec.startsWith('①')) sc += 2;
          if (t.indexOf(k) < 12) sc += 1;
          if (!best || sc > best.sc) best = {sc, t, src: a + 'の解説から'};
        }
      }
    }
  }
  LG[k] = best && best.sc > 0 ? {t: best.t, w: '', src: best.src} : null;
  return LG[k];
}

/* 科目 → 20_Study 配下のフォルダ名（復習フィードの SUBJ_DIR と揃える） */

function ingest(data, full){
  (data.days || []).forEach(d => {
    (d.qs || []).forEach(q => {
      q.ai = remapAiMap(q.ai);
      if (q.review) q.review = remapAiMap(q.review);
      (q.missing || []).forEach(m => { m.a = canonAi(m.a); });
    });
    if (d.extra) DAYX[d.day] = d.extra;
    const ex = DB.days.find(x => x.day === d.day);
    if (ex) ex.qs = d.qs; else DB.days.push(d);
    if (full) LOADED.add(d.day);
  });
  Object.assign(ARTS, data.arts || {});
  Object.assign(JOBUN, data.jobun || {});
  Object.assign(GIST, data.gist || {});
  Object.assign(GIST, data.gist || {});
  Object.assign(PAST, data.past || {});
  if (data.freq) Object.assign(FREQ, data.freq);
  if (data.nq) NQ = data.nq;
  buildFlat();
}

/* ---- 冒頭の「頭に入る版」 ----
   qsummary.py が6社の解説から作った要約（q.sum）を最初に見せる。
   ○×の一致・割れは要約に頼らず各社の choices から数える。
   図解と肢ごとの各社解説は、元の本文をそのまま切り替えて読めるようにする。 */
const SM_CH = /^\s*(?:[-*+]\s+)?(?:#{2,5}\s+)?\*{0,2}\s*(?:肢\s*)?([ア-オ]|[1-5]|[１-５])(?![0-9０-９．.])[^\n]{0,60}?([○◯〇×✕])/gm;
const SM_Z = s => s.replace(/[１-５]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
const SM_OX = s => ({'◯':'○','〇':'○','✕':'×'}[s] || s);
function smLegs(text){
  const out = {}; if (!text) return out;
  const hits = [...String(text).matchAll(SM_CH)];
  if (hits.length < 2) return out;
  hits.forEach((m, i) => {
    const lab = SM_Z(m[1]);
    const end = i + 1 < hits.length ? hits[i+1].index : text.length;
    if (!out[lab]) out[lab] = text.slice(m.index, end).trim();
  });
  return out;
}
function smSec(v, mark){
  const k = Object.keys(v.sections || {}).find(x => x.startsWith(mark));
  return k ? v.sections[k] : '';
}
let SM_SHUT = false;
try { SM_SHUT = localStorage.getItem('x_sm_shut') === '1'; } catch(e){}
function sumBlock(q){
  const S = q.sum; if (!S) return '';
  const A = ais(q);
  const em = t => esc(t || '').replace(/【(.+?)】/g, '<em>$1</em>');
  const tabs = (grp, items, on) => '<div class="sm-tabs" data-g="' + grp + '">' + items.map(([k, lbl]) =>
      '<button data-k="' + esc(k) + '" class="' + (k === on ? 'on' : '') + '">' + lbl + '</button>').join('') + '</div>';
  const pane = (grp, k, on, html, cls) => '<div class="sm-pane ' + (cls || '') + (k === on ? ' on' : '')
      + '" data-g="' + grp + '" data-k="' + esc(k) + '">' + html + '</div>';
  let h = '';
  /* 1 軸 */
  const ax = S.axis || {};
  if (ax.boxes && ax.boxes.length) {
    h += '<h4>① まず、この問題の軸</h4>' + (ax.lead ? '<p class="sm-lead">' + esc(ax.lead) + '</p>' : '')
      + '<div class="sm-q">' + ax.boxes.map(b => '<div class="sm-qb"><div class="qt">' + esc(b.q || '') + '</div>'
        + (b.rows || []).map(r => '<div class="r"><b>' + esc(r[0] || '') + '</b> <span>' + esc(r[1] || '') + '</span></div>').join('')
        + '</div>').join('') + '</div>'
      + (ax.note ? '<p class="sm-note">' + esc(ax.note) + '</p>' : '');
  }
  /* 2 図解（各社の②をそのまま）。論文の②は骨格 */
  const RB = S.kind === 'ronbun';
  const zu = A.filter(a => smSec(q.ai[a], '②').trim());
  if (zu.length) {
    const on = zu.includes(S.zu) ? S.zu : zu[0];
    h += (RB ? '<h4>② 骨格 <span class="sm-note">（' + zu.length + '社の骨格を切り替え）</span></h4>'
             : '<h4>② 図解 <span class="sm-note">（' + zu.length + '社の図を切り替え）</span></h4>')
      + tabs('zu', zu.map(a => [a, esc(a)]), on)
      + zu.map(a => pane('zu', a, on, '<div class="sm-zu">' + md(smSec(q.ai[a], '②')) + '</div>')).join('');
  }
  /* 3 肢ごと */
  const legs = S.legs || [];
  if (legs.length) {
    const per = {};
    A.forEach(a => {
      per[a] = smLegs(smSec(q.ai[a], '⑥'));
      /* ChatGPT は肢ごとの解説を①の中に書くことがある → ⑥で取れなければ本文全体から */
      if (!Object.keys(per[a]).length) per[a] = smLegs(Object.values(q.ai[a].sections || {}).join('\n\n'));
    });
    h += '<h4>③ 肢ごとの判断</h4>' + legs.map((L, i) => {
      const lab = SM_Z(String(L.l || ''));
      const votes = {};
      A.forEach(a => { const c = ((q.ai[a].choices || {})[lab] || '').trim(); if (c) (votes[SM_OX(c)] = votes[SM_OX(c)] || []).push(a); });
      const kinds = Object.keys(votes);
      let chip = '';
      if (kinds.length === 1) chip = '<span class="sm-chip">' + votes[kinds[0]].length + '社一致</span>';
      else if (kinds.length > 1) {
        const minor = kinds.sort((x, y) => votes[x].length - votes[y].length)[0];
        chip = '<span class="sm-chip split">' + votes[minor].map(esc).join('・') + 'だけ' + esc(minor) + '</span>';
      }
      const ox = SM_OX(L.ox || '');
      const who = A.filter(a => per[a][lab]);
      const gid = 'lg' + i, on = who[0];
      const wrong = a => { const c = SM_OX(((q.ai[a].choices || {})[lab] || '').trim()); return c && ox && c !== ox; };
      return '<div class="sm-leg"><div class="sm-lh"><span class="sm-lid">' + esc(L.l || '') + '</span>'
        + '<span class="sm-ox ' + (ox === '×' ? 'x' : 'o') + '">' + esc(ox) + '</span>'
        + (L.look ? '<span class="sm-look">' + esc(L.look) + '</span>' : '') + chip + '</div>'
        + '<p class="sm-one">' + em(L.one) + '</p>'
        + (L.src ? '<div class="sm-src">' + esc(L.src) + '</div>' : '')
        + (L.warn ? '<div class="sm-warn">⚠ ' + esc(L.warn) + '</div>' : '')
        + (who.length ? '<details><summary>各社の解説（' + who.length + '社）</summary>'
          + tabs(gid, who.map(a => [a, esc(a) + (wrong(a) ? '<span class="x">×</span>' : '')]), on)
          + who.map(a => pane(gid, a, on, md(per[a][lab]), 'sm-ai' + (wrong(a) ? ' bad' : ''))).join('')
          + '</details>' : '')
        + '</div>';
    }).join('');
  }
  /* 3' 論文：論点ごとに 規範 → 使う事実 → 結論（2026-09-26） */
  const flow = S.flow || [];
  if (flow.length) {
    const rc = A.filter(a => smSec(q.ai[a], '③').trim());
    h += '<h4>③ 論点ごとの流れ <span class="sm-note">（答案に書く順）</span></h4>' + flow.map(F =>
      '<div class="sm-leg sm-fl"><div class="sm-lh"><span class="sm-fn">' + esc(F.n || '') + '</span></div>'
      + (F.rule ? '<p class="sm-one"><span class="sm-tg">規範</span>' + em(F.rule) + '</p>' : '')
      + ((F.facts || []).length ? '<div class="sm-fx"><span class="sm-tg">使う事実</span>' + F.facts.map(x => '<span class="sm-look">' + esc(x) + '</span>').join('') + '</div>' : '')
      + (F.concl ? '<p class="sm-cc"><span class="sm-tg">結論</span>' + esc(F.concl) + '</p>' : '')
      + (F.src ? '<div class="sm-src">' + esc(F.src) + '</div>' : '')
      + (F.warn ? '<div class="sm-warn">⚠ ' + esc(F.warn) + '</div>' : '')
      + '</div>').join('')
      + (rc.length ? '<details><summary>各社の規範カード（' + rc.length + '社）</summary>'
        + tabs('rc', rc.map(a => [a, esc(a)]), rc[0])
        + rc.map(a => pane('rc', a, rc[0], md(smSec(q.ai[a], '③')), 'sm-ai')).join('') + '</details>' : '');
  }
  /* 4 取り違え */
  if ((S.traps || []).length)
    h += '<h4>④ 取り違えやすいところ</h4>' + S.traps.map(t => '<div class="sm-pair"><b>' + esc(t[0] || '') + '</b><span>' + esc(t[1] || '') + '</span></div>').join('');
  /* 5 要件表 */
  if ((S.reqs || []).length)
    h += '<h4>⑤ 条文ごとの要件</h4><table><thead><tr><th>条文</th><th>' + (RB ? '何の場面か' : '何の書面・場面か') + '</th><th>要件</th></tr></thead><tbody>'
      + S.reqs.map(r => '<tr><td>' + esc(r[0] || '') + '</td><td>' + esc(r[1] || '') + '</td><td>' + esc(r[2] || '') + '</td></tr>').join('')
      + '</tbody></table>';
  /* 6 次回 */
  if ((S.must || []).length)
    h += '<h4>⑥ 答案に必ず書く一文</h4><ul class="sm-must">' + S.must.map(x => '<li>' + em(x) + '</li>').join('') + '</ul>';

/* ---- 問題を同じ画面に並べる（2026-09-25） ----
   画面を分けず、ページの中に「問題の引き出し」を出す。横長（iPad横・Mac）は右半分、
   縦長は下半分。開いたまま別の問題へ移ると、その問題のPDFに差し替わる。
   問題PDFのリンクは公開データでは暗号化してある（pdfx）。合言葉を1回入れると、
   そこから作った鍵をこの端末に保存して、以後は自動で開く。 */
let PK = null;
const PDFKEY = 'x_pdfkey';
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = u => btoa(String.fromCharCode(...new Uint8Array(u)));
let PDF_KEY = null;
async function pdfKeyStored(){
  if (PDF_KEY) return PDF_KEY;
  let raw = null; try { raw = localStorage.getItem(PDFKEY); } catch(e){}
  if (!raw || !crypto.subtle) return null;
  try { PDF_KEY = await crypto.subtle.importKey('raw', b64d(raw), 'AES-GCM', false, ['decrypt']); } catch(e){ return null; }
  return PDF_KEY;
}
async function pdfDec(key, x){
  const u = b64d(x);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:u.slice(0,12)}, key, u.slice(12));
  return new TextDecoder().decode(pt);
}
async function pdfKeyFrom(pass){
  if (!PK) throw new Error('合言葉の情報がありません');
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64d(PK.s), iterations:PK.i}, base, 256);
  const key = await crypto.subtle.importKey('raw', bits, 'AES-GCM', false, ['decrypt']);
  if (await pdfDec(key, PK.c) !== 'qgather-ok') throw new Error('mismatch');
  try { localStorage.setItem(PDFKEY, b64e(bits)); } catch(e){}
  PDF_KEY = key;
  return key;
}
async function pdfUrlOf(q){
  if (q.pdf) return q.pdf;
  if (!q.pdfx) return '';
  const key = await pdfKeyStored(); if (!key) return null;      /* null＝合言葉が要る */
  try { return await pdfDec(key, q.pdfx); }
  catch(e){ try { localStorage.removeItem(PDFKEY); } catch(_){} PDF_KEY = null; return null; }
}

try { DRAWER_ON = localStorage.getItem('xpdf_open') === '1'; } catch(e){}
function drawerEl(){
  let d = document.getElementById('qdrawer');

    document.body.appendChild(d);
    d.querySelector('#qd-x').onclick = () => setDrawer(false);

}
function setDrawer(on, url, title){
  DRAWER_ON = on;
  try { localStorage.setItem('xpdf_open', on ? '1' : '0'); } catch(e){}
  const d = drawerEl();

/* #2026-09-12刑訴法/Q258 でも #Q258 でも開ける（復習フィードから飛ばすため）。 */
function fromHash(){
  const h = decodeURIComponent(String(location.hash || '').replace(/^#/, '')).trim();
  if (!h) return null;
  const [a, b] = h.split('/');
  const last = arr => arr.length ? arr[arr.length - 1].day + arr[arr.length - 1].id : null;
  if (b) {
    const q = flat.find(x => x.day === a && x.id === b);
    if (q) return q.day + q.id;
    /* Q番号は科目ごとの通し番号なので、科目名で絞れる形も受ける（例 #商法/Q258）。 */
    const bySubj = last(flat.filter(x => x.subject === a && x.id === b));
    if (bySubj) return bySubj;
  }
  return last(flat.filter(x => x.id === a));   /* 番号だけなら直近の日のもの */
}

function firstOfNewestDay(){
  let pick = null;
  DB.days.forEach(d => { if (d.qs.length && (!pick || d.day > pick.day)) pick = d; });
  return pick ? pick.day + pick.qs[0].id : (flat.length ? flat[0].day + flat[0].id : null);
}

  const acts = [];
  if (t.law) acts.push('<a href="https://laws.e-gov.go.jp/law/' + t.law + '#Mp-At_' + t.at + '" target="_blank" rel="noopener">📜 e-Govで条文</a>');
  acts.push('<a href="https://www.google.com/search?q=' + encodeURIComponent(k + (isArt ? ' 趣旨 要件' : ' 判旨')) + '" target="_blank" rel="noopener">🔎 Webで調べる</a>');
  if (!isArt) acts.push('<a href="https://www.google.com/search?q=' + encodeURIComponent(k + ' site:courts.go.jp') + '" target="_blank" rel="noopener">⚖️ 裁判所の判例</a>');
  acts.push('<a href="' + obsSearch(k) + '">🔍 Vaultを検索</a>');
  const jl = t.j ? t.j.split('\n') : [];
  const box = document.createElement('div');
  box.className = 'wk-pop';
  box.innerHTML = '<div class="art"><b>' + esc(k) + '</b>' + (t.w ? ' <span class="nick">' + esc(t.w) + '</span>' : '')
    + (jl.length ? '<p class="jh">' + esc(jl[0]) + '</p><details><summary>条文を読む（現行法・e-Gov）</summary>' + esc(jl.slice(1).join('\n')) + '</details>' : '')
    + '<p class="gist' + (t.g ? '' : ' none') + '">' + esc(t.g || 'まだ一言まとめがありません。') + '</p>'
    + (t.gs ? '<span class="src">出典 ' + esc(t.gs) + '</span>' : '')
    + '<div class="rf"><span class="lbl">この語が出た問題（' + (t.refs || []).length + '）</span>'
    + (t.refs || []).map(ref => { const [d, id] = ref.split('|');
        return '<a href="' + qhref(d, id) + '">' + esc(refLabel(ref)) + (inWeek.has(ref) ? '<em>今週</em>' : '') + '</a>'; }).join('')
    + '</div><div class="acts"><span class="lbl">調べる</span>' + acts.join('') + '</div></div>';
  row.after(box);
}
/* #日付科目/Q18/④ の3つ目＝その見出しまでスクロール */
function scrollToSec(sec){
  if (!sec) return;
  const h = [...main.querySelectorAll('h4')].find(x => x.textContent.trim().startsWith(sec));
  if (h) setTimeout(() => h.scrollIntoView({block:'start'}), 60);
}
const hashSec = () => decodeURIComponent(String(location.hash || '').replace(/^#/, '')).split('/')[2] || '';
const isWeekHash = () => location.hash === '#week';
window.addEventListener('hashchange', () => {
  if (isWeekHash()) { renderWeek(); return; }
  const u = fromHash(), sec = hashSec(); if (u) Promise.resolve(show(u)).then(() => scrollToSec(sec));
});
boot();
